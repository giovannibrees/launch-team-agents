name = "ad-studio"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Import the UI (src/index.html) as a string the Worker serves directly,
# so the password gate covers it too.
[[rules]]
type = "Text"
globs = ["**/*.html"]

# D1 = Cloudflare's SQLite. Create it once (see README), then paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "ad-studio"
database_id = "PASTE_AFTER_wrangler_d1_create"

# Non-secret defaults. Secrets (SIGNUP_CODE, *_API_KEY) go via `wrangler secret put`.
[vars]
EMBEDDING_PROVIDER = "voyage"
# Password hashing cost. 100000 is secure but ~45ms CPU — OVER the Workers FREE
# 10ms/req limit, so signup/login fail on free. Options:
#   • Workers PAID ($5/mo): leave at 100000 (recommended for real multi-user).
#   • Free plan: set this to ~12000 (weaker, but logins work). Stored per-user,
#     so changing it later never breaks existing accounts.
PBKDF2_ITERATIONS = "100000"
