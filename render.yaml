# One-click deploy of Ad Studio to Render (https://render.com).
# In Render: New + → Blueprint → connect this repo → Apply. Free plan works.
services:
  - type: web
    name: ad-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 platform/app/server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: COOKIE_SECURE
        value: "1"                # Render serves over HTTPS
      # The app is multi-user (accounts). Optionally require an invite code to
      # sign up so the public URL isn't open to the world.
      - key: SIGNUP_CODE
        sync: false
      # Optional owner-wide fallback keys (shared by all users; prefer per-user
      # keys entered in the in-app Settings tab).
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    # IMPORTANT: SQLite resets on redeploy/sleep without a disk — accounts would
    # vanish. Attach a Render persistent disk and point ADSTUDIO_DB at it, or use
    # your own server (docs/deploy-hetzner.md).
